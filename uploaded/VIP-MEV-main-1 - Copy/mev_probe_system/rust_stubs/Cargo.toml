[package]
name = "mev_probe_system"
version = "0.1.0"
edition = "2021"

[dependencies]
# Solana
solana-sdk = "1.18"
solana-client = "1.18"
solana-transaction-status = "1.18"

# Async
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Data structures
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Random
rand = "0.8"
statrs = "0.16"

# Database (optional)
# sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres"] }

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
criterion = "0.5"
tokio-test = "0.4"
