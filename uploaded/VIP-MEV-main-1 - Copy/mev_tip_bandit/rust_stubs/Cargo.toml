[package]
name = "mev_tip_bandit"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
statrs = "0.16"  # For statistical distributions
log = "0.4"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"  # For benchmarking
