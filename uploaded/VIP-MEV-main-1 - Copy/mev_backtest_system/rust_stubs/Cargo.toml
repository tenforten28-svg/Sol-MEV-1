[package]
name = "mev_backtest_system"
version = "0.1.0"
edition = "2021"

[dependencies]
# Solana
solana-sdk = "1.18"
solana-client = "1.18"
solana-transaction-status = "1.18"

# Async
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Data structures
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Storage
rocksdb = "0.21"
# s3 = "0.33"  # Optional

# HTTP
reqwest = { version = "0.11", features = ["json"] }

# Math & Stats
statrs = "0.16"
rand = "0.8"

# Logging
log = "0.4"
tracing = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
tokio-test = "0.4"
