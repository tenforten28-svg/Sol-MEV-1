[package]
name = "solana-price-feed"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-client = "1.18"
solana-sdk = "1.18"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
